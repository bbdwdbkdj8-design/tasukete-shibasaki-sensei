<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>助けて！柴咲先生！</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #07181a;
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #eaf6f3;
        touch-action: none;
        overscroll-behavior: none;
      }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      .screen {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        background: rgba(4, 20, 22, 0.88);
        z-index: 10;
      }
      .screen.hidden { display: none; }

      .title-heart { font-size: 64px; line-height: 1; animation: pulse 1.1s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(255,60,80,.55)); }
      @keyframes pulse { 0%,100% { transform: scale(1); } 18% { transform: scale(1.14); } 36% { transform: scale(1); } 52% { transform: scale(1.09); } 70% { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .title-heart { animation: none; } }

      h1 {
        margin: 18px 0 6px; font-size: clamp(30px, 9vw, 44px); font-weight: 900; letter-spacing: .04em;
        color: #fff;
      }
      h1 .accent { color: #ff5468; }
      .sub { margin: 0 0 8px; font-size: 14px; color: #9fd8cf; letter-spacing: .12em; }
      .howto {
        margin: 18px 0 26px; font-size: 15px; line-height: 2; color: #d9efe9;
        background: rgba(255,255,255,.06); border: 1px solid rgba(159,216,207,.25);
        border-radius: 14px; padding: 14px 20px;
      }
      .howto b { color: #ffd166; }
      .howto .die { color: #ff7285; font-weight: 700; }

      .big-btn {
        appearance: none; border: none; cursor: pointer;
        min-height: 56px; padding: 14px 42px;
        font-family: inherit; font-size: 20px; font-weight: 800; letter-spacing: .08em;
        color: #fff; background: #d92b3f; border-radius: 999px;
        box-shadow: 0 6px 24px rgba(217,43,63,.5);
      }
      .big-btn:active { transform: scale(.97); }
      .big-btn.teal { background: #0e7c6b; box-shadow: 0 6px 24px rgba(14,124,107,.5); }

      .result-title { font-size: clamp(34px, 11vw, 52px); font-weight: 900; margin: 10px 0 8px; }
      .result-title.win { color: #7dffb0; text-shadow: 0 0 24px rgba(80,255,150,.45); }
      .result-title.clear { color: #ffd166; text-shadow: 0 0 24px rgba(255,209,102,.45); }
      .result-title.lose { color: #ff5468; text-shadow: 0 0 24px rgba(255,60,80,.5); }
      .result-msg { font-size: 16px; line-height: 1.9; color: #d9efe9; margin: 0 0 28px; }
      .result-emoji { font-size: 68px; line-height: 1; }

      /* ===== 全クリア時：朝焼けの屋上シーン ===== */
      #rooftop-scene { display: none; }
      #result-screen.win-mode { background: #1d1526; overflow: hidden; }
      #result-screen.win-mode #rooftop-scene {
        display: block; position: absolute; inset: 0; z-index: 0;
      }
      #rooftop-scene svg { width: 100%; height: 100%; display: block; }
      #result-screen.win-mode > *:not(#rooftop-scene) { position: relative; z-index: 1; }
      #result-screen.win-mode .result-title.win {
        color: #fff7ea; text-shadow: 0 2px 22px rgba(255,140,80,.85), 0 1px 3px rgba(60,20,50,.6);
      }
      #result-screen.win-mode .result-msg {
        color: #fff3e2;
        background: rgba(24, 12, 30, 0.48);
        border: 1px solid rgba(255, 200, 150, 0.35);
        border-radius: 14px; padding: 14px 18px;
        text-shadow: 0 1px 3px rgba(40, 10, 30, .55);
      }
      #result-screen.win-mode .result-emoji { filter: drop-shadow(0 2px 10px rgba(255,150,80,.7)); }

      /* ===== 屋上から落ちるフェードアウト ===== */
      #result-screen.falling {
        animation: fallAway 1.15s cubic-bezier(.5, 0, .9, .4) forwards;
        pointer-events: none;
      }
      @keyframes fallAway {
        0%   { transform: translateY(0) rotate(0deg); opacity: 1; filter: blur(0); }
        12%  { transform: translateY(1.6vh) rotate(-0.4deg); opacity: 1; }
        55%  { opacity: 0.85; }
        100% { transform: translateY(108vh) rotate(2.6deg); opacity: 0; filter: blur(3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #result-screen.falling { animation: fallFade .3s ease-out forwards; }
        @keyframes fallFade { to { opacity: 0; } }
      }

      #hud {
        position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 0; right: 0;
        display: flex; justify-content: flex-start; align-items: flex-start; gap: 8px;
        padding: 0 14px; z-index: 5; pointer-events: none;
      }
      #stage-label {
        font-size: 15px; font-weight: 800; letter-spacing: .1em; color: #ffe9a8;
        background: rgba(4,24,26,.55); border-radius: 999px; padding: 8px 14px;
      }
      #stage-label.final {
        color: #fff; background: rgba(160,20,40,.75);
        box-shadow: 0 0 14px rgba(255,60,80,.55);
      }
      #progress-label {
        font-size: 15px; font-weight: 800; letter-spacing: .1em; color: #bff3e6;
        background: rgba(4,24,26,.55); border-radius: 999px; padding: 8px 14px;
      }
      #stage-dots { display: flex; gap: 5px; align-items: center; padding: 13px 2px 0; }
      #stage-dots span {
        width: 9px; height: 9px; border-radius: 50%;
        background: rgba(255,255,255,.22);
      }
      #stage-dots span.done { background: #3dff9e; }
      #stage-dots span.now { background: #ffd166; box-shadow: 0 0 8px rgba(255,209,102,.8); }
      #bgm-btn {
        position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 14px; z-index: 30;
        appearance: none; border: 1px solid rgba(159,216,207,.4); cursor: pointer;
        min-width: 48px; min-height: 40px; padding: 8px 14px;
        font-family: inherit; font-size: 14px; font-weight: 700;
        color: #bff3e6; background: rgba(4,24,26,.55); border-radius: 999px;
      }
      #hint {
        position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom));
        text-align: center; font-size: 14px; color: #9fd8cf; letter-spacing: .08em;
        z-index: 5; pointer-events: none; padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>

    <div id="hud" style="visibility:hidden">
      <div id="stage-label">STAGE 1/6</div>
      <div id="stage-dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div id="progress-label">切開 0%</div>
    </div>
    <button id="bgm-btn" type="button">♪ BGM：ON</button>
    <div id="hint" style="visibility:hidden">緑の丸から、指を離さず線をなぞって</div>

    <!-- タイトル -->
    <div class="screen" id="title-screen">
      <div class="title-heart">🫀</div>
      <h1>助けて！<span class="accent">柴咲先生！</span></h1>
      <p class="sub">― 天才外科医、超集中 ―</p>
      <div class="howto">
        線に沿って、ミシンみたいに<br>
        心臓をまっすぐ縫うようになぞるだけ。<br>
        <b>全6ステージ制。</b>進むほど線は細く、<br>
        クネクネと難しくなっていく。<br>
        最終ステージは<b>「虎澤先輩」</b>。<br>
        <b>指を離さず、ゆっくり正確に。</b><br>
        <span class="die">線からはみ出したら、患者は死ぬ。</span>
      </div>
      <button class="big-btn" id="start-btn" type="button">手術開始</button>
    </div>

    <!-- 結果 -->
    <div class="screen hidden" id="result-screen">
      <!-- 全クリア時だけ表示：朝焼けの屋上 -->
      <div id="rooftop-scene" aria-hidden="true">
        <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" focusable="false">
          <defs>

              <stop offset="0" stop-color="#232c52"/>
              <stop offset="0.28" stop-color="#57406e"/>
              <stop offset="0.48" stop-color="#b8556b"/>
              <stop offset="0.63" stop-color="#f07f5f"/>
              <stop offset="0.78" stop-color="#ffb877"/>
              <stop offset="1" stop-color="#ffe3ae"/>
            </linearGradient>
            <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffd98c" stop-opacity="0.95"/>

              <stop offset="1" stop-color="#ffab63" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">

            </linearGradient>
            <pattern id="fenceMesh" width="9" height="9" patternUnits="userSpaceOnUse">

              <path d="M0,0 L9,9 M-2,7 L2,11 M7,-2 L11,2" stroke="#140d1e" stroke-width="1.1" opacity="0.55"/>
            </pattern>
          </defs>

          <!-- 朝焼けの空 -->
          <rect x="0" y="0" width="400" height="800" fill="url(#skyGrad)"/>
          <!-- 雲 -->
          <g fill="#ff9e8a" opacity="0.5">
            <ellipse cx="70" cy="130" rx="58" ry="11"/>
            <ellipse cx="120" cy="142" rx="42" ry="8"/>
            <ellipse cx="320" cy="215" rx="66" ry="12"/>
            <ellipse cx="265" cy="228" rx="40" ry="8"/>
            <ellipse cx="150" cy="320" rx="52" ry="9"/>
          </g>
          <g fill="#6e4470" opacity="0.35">
            <ellipse cx="300" cy="105" rx="48" ry="9"/>
            <ellipse cx="60" cy="255" rx="44" ry="8"/>
          </g>
          <!-- 鳥 -->
          <g stroke="#33203f" stroke-width="2.4" fill="none" stroke-linecap="round">
            <path d="M118,168 q6,-6 12,0 q6,-6 12,0"/>
            <path d="M160,190 q5,-5 10,0 q5,-5 10,0"/>
          </g>
          <!-- 太陽 -->
          <circle cx="200" cy="472" r="105" fill="url(#sunGlow)"/>
          <circle cx="200" cy="472" r="47" fill="#ffcf8f" opacity="0.8"/>
          <circle cx="200" cy="472" r="33" fill="#fff3d6"/>

          <!-- 遠景の街並み -->
          <g fill="#3a2b4d" opacity="0.92">
            <rect x="-5" y="440" width="42" height="72"/>
            <rect x="42" y="420" width="30" height="92"/>
            <rect x="78" y="452" width="48" height="60"/>
            <rect x="290" y="430" width="36" height="82"/>
            <rect x="332" y="448" width="30" height="64"/>
            <rect x="366" y="424" width="40" height="88"/>
          </g>
          <g fill="#2c2140">
            <rect x="120" y="458" width="52" height="54"/>
            <rect x="228" y="452" width="58" height="60"/>
            <rect x="176" y="470" width="48" height="42"/>
          </g>
          <!-- 朝日に光る窓 -->
          <g fill="#ffd98c" opacity="0.75">
            <rect x="52" y="436" width="5" height="7"/><rect x="62" y="452" width="5" height="7"/>
            <rect x="300" y="446" width="5" height="7"/><rect x="376" y="440" width="5" height="7"/>
            <rect x="240" y="466" width="5" height="7"/>
          </g>

          <!-- 屋上のフェンス -->
          <rect x="0" y="372" width="400" height="136" fill="url(#fenceMesh)"/>
          <rect x="0" y="368" width="400" height="6" fill="#1d1428"/>
          <rect x="0" y="436" width="400" height="4" fill="#1d1428" opacity="0.8"/>
          <g fill="#1d1428">
            <rect x="6" y="368" width="6" height="142"/>
            <rect x="102" y="368" width="6" height="142"/>
            <rect x="198" y="368" width="6" height="142"/>
            <rect x="294" y="368" width="6" height="142"/>
            <rect x="388" y="368" width="6" height="142"/>
          </g>

          <!-- パラペット（屋上の縁） -->
          <rect x="0" y="508" width="400" height="26" fill="#241a33"/>
          <rect x="0" y="508" width="400" height="3" fill="#ffb877" opacity="0.55"/>

          <!-- 屋上の床 -->
          <rect x="0" y="534" width="400" height="266" fill="url(#floorGrad)"/>
          <g stroke="#ffb877" stroke-width="1.4" opacity="0.13">
            <path d="M60,534 L10,800"/><path d="M150,534 L120,800"/>
            <path d="M250,534 L280,800"/><path d="M340,534 L392,800"/>
            <path d="M0,610 L400,610"/><path d="M0,700 L400,700"/>
          </g>
          <!-- 水たまりの朝日反射 -->
          <ellipse cx="255" cy="668" rx="62" ry="10" fill="#ffb877" opacity="0.20"/>
          <ellipse cx="255" cy="668" rx="34" ry="5" fill="#ffe3ae" opacity="0.25"/>

          <!-- 給水タンクと室外機のシルエット -->
          <g fill="#171022">
            <rect x="18" y="618" width="64" height="52"/>
            <path d="M14,618 L86,618 L50,592 Z"/>
            <rect x="30" y="670" width="8" height="26"/><rect x="62" y="670" width="8" height="26"/>
            <rect x="322" y="640" width="56" height="38"/>
            <rect x="330" y="626" width="40" height="14"/>
          </g>
          <rect x="18" y="618" width="64" height="3" fill="#ffb877" opacity="0.35"/>
        </svg>
      </div>
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-title win" id="result-title">オペ成功！</div>
      <p class="result-msg" id="result-msg"></p>
      <button class="big-btn teal" id="retry-btn" type="button">もう一度オペ</button>
      <button class="big-btn" id="restart-btn" type="button" style="display:none; margin-top:14px; font-size:16px; min-height:48px; padding:10px 30px;">STAGE 1からやり直す</button>
    </div>

    <script>
      'use strict';

      // ============ Canvas / レイアウト ============
      var canvas = document.getElementById('game');
      var ctx = canvas.getContext('2d');
      var W = 0, H = 0, DPR = 1;

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        buildPath();
      }

      // ============ ガイド線（切開ライン）／ステージ定義 ============
      // 画面比率ベースのコントロールポイントを Catmull-Rom で滑らかにサンプリング
      // ステージが進むほど：線が長く・蛇行が激しく・心臓の鼓動が速くなる
      // tolScale … はみ出し許容幅の倍率（小さいほど難しい）
      var STAGES = [
        { name: '研修医オペ', tolScale: 1.30, bpm: 72, ctrl: [
          [0.30, 0.28], [0.58, 0.32], [0.40, 0.47], [0.60, 0.60], [0.44, 0.72]
        ]},
        { name: '執刀医オペ', tolScale: 1.05, bpm: 84, ctrl: [
          [0.28, 0.27], [0.62, 0.26], [0.38, 0.40], [0.64, 0.52], [0.36, 0.63], [0.56, 0.74]
        ]},
        { name: '難症例オペ', tolScale: 0.88, bpm: 96, ctrl: [
          [0.28, 0.27], [0.62, 0.225], [0.36, 0.335], [0.68, 0.42],
          [0.32, 0.50], [0.64, 0.575], [0.38, 0.66], [0.56, 0.745]
        ]},
        { name: '緊急オペ', tolScale: 0.72, bpm: 110, ctrl: [
          [0.24, 0.26], [0.68, 0.22], [0.30, 0.32], [0.72, 0.40],
          [0.26, 0.48], [0.66, 0.55], [0.30, 0.62], [0.62, 0.68], [0.42, 0.76]
        ]},
        { name: '伝説のオペ', tolScale: 0.58, bpm: 126, ctrl: [
          [0.20, 0.25], [0.74, 0.21], [0.24, 0.30], [0.76, 0.37],
          [0.22, 0.44], [0.72, 0.50], [0.26, 0.57], [0.70, 0.63],
          [0.30, 0.69], [0.60, 0.77]
        ]},
        { name: '虎澤先輩', tolScale: 0.46, bpm: 140, ctrl: [
          [0.18, 0.24], [0.78, 0.20], [0.20, 0.28], [0.80, 0.34],
          [0.18, 0.40], [0.76, 0.46], [0.22, 0.52], [0.78, 0.58],
          [0.24, 0.64], [0.72, 0.69], [0.32, 0.74], [0.58, 0.79]
        ]}
      ];
      var stage = 0;        // 現在のステージ（0始まり）
      var totalTime = 0;    // クリア済みステージの合計タイム(秒)

      var pathPts = [];   // {x, y}
      var pathLen = [];   // 累積長
      var totalLen = 0;

      function buildPath() {
        pathPts = []; pathLen = []; totalLen = 0;
        var pts = STAGES[stage].ctrl.map(function (p) { return { x: p[0] * W, y: p[1] * H }; });
        var ext = [pts[0]].concat(pts, [pts[pts.length - 1]]);
        var SAMPLES = 26;
        for (var i = 0; i < ext.length - 3; i++) {
          var p0 = ext[i], p1 = ext[i + 1], p2 = ext[i + 2], p3 = ext[i + 3];
          for (var j = 0; j < SAMPLES; j++) {
            var t = j / SAMPLES, t2 = t * t, t3 = t2 * t;
            pathPts.push({
              x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
              y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
            });
          }
        }
        pathPts.push(pts[pts.length - 1]);
        for (var k = 0; k < pathPts.length; k++) {
          if (k === 0) { pathLen.push(0); continue; }
          var dx = pathPts[k].x - pathPts[k - 1].x, dy = pathPts[k].y - pathPts[k - 1].y;
          totalLen += Math.sqrt(dx * dx + dy * dy);
          pathLen.push(totalLen);
        }
      }

      // ============ ゲーム状態 ============
      var STATE = { TITLE: 0, PLAY: 1, DEAD: 2, WIN: 3, STAGECLEAR: 4 };
      var state = STATE.TITLE;
      var progress = 0;          // pathPts のインデックス
      var touching = false;
      var started = false;       // スタート地点を押さえたか
      var finger = null;         // {x, y}
      var deathAt = 0;
      var shake = 0;
      var startTime = 0;
      var TOL = 30;              // 許容誤差(px)

      var hud = document.getElementById('hud');
      var hint = document.getElementById('hint');
      var progressLabel = document.getElementById('progress-label');
      var stageLabel = document.getElementById('stage-label');
      var stageDots = document.getElementById('stage-dots').children;

      function tolRadius() { return Math.max(11, Math.min(W, H) * 0.046 * STAGES[stage].tolScale); }

      function updateStageHud() {
        var isFinal = stage === STAGES.length - 1;
        stageLabel.textContent = (isFinal ? 'FINAL STAGE ' : 'STAGE ' + (stage + 1) + '/' + STAGES.length + ' ') + STAGES[stage].name;
        stageLabel.className = isFinal ? 'final' : '';
        for (var i = 0; i < stageDots.length; i++) {
          stageDots[i].className = i < stage ? 'done' : (i === stage ? 'now' : '');
        }
      }

      // ============ 描画 ============
      function heartPath(cx, cy, s) {
        ctx.beginPath();
        ctx.moveTo(cx, cy + s * 0.92);
        ctx.bezierCurveTo(cx - s * 1.25, cy + s * 0.28, cx - s * 1.05, cy - s * 0.78, cx - s * 0.52, cy - s * 0.82);
        ctx.bezierCurveTo(cx - s * 0.18, cy - s * 0.85, cx, cy - s * 0.55, cx, cy - s * 0.34);
        ctx.bezierCurveTo(cx, cy - s * 0.55, cx + s * 0.18, cy - s * 0.85, cx + s * 0.52, cy - s * 0.82);
        ctx.bezierCurveTo(cx + s * 1.05, cy - s * 0.78, cx + s * 1.25, cy + s * 0.28, cx, cy + s * 0.92);
        ctx.closePath();
      }

      function ecgY(x, t) {
        // 心電図波形：周期ごとに QRS 波
        if (state === STATE.DEAD) return 0;
        var period = 300; // px
        var p = ((x + t * 140) % period) / period;
        var y = 0;
        if (p < 0.08) y = -Math.sin(p / 0.08 * Math.PI) * 4;                    // P波
        else if (p < 0.11) y = (p - 0.08) / 0.03 * 5;                            // Q
        else if (p < 0.16) y = 5 - (p - 0.11) / 0.05 * 34;                       // R（上へ）
        else if (p < 0.21) y = -29 + (p - 0.16) / 0.05 * 36;                     // S
        else if (p < 0.24) y = 7 - (p - 0.21) / 0.03 * 7;
        else if (p < 0.38) y = -Math.sin((p - 0.24) / 0.14 * Math.PI) * 7;       // T波
        return y;
      }

      function draw(now) {
        ctx.save();
        if (shake > 0) {
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
          shake *= 0.88; if (shake < 0.4) shake = 0;
        }

        // 背景：手術室の暗い青緑 + ビネット
        ctx.fillStyle = '#07181a';
        ctx.fillRect(-20, -20, W + 40, H + 40);
        var vg = ctx.createRadialGradient(W / 2, H * 0.44, 40, W / 2, H * 0.44, Math.max(W, H) * 0.75);
        vg.addColorStop(0, 'rgba(46,110,104,0.35)');
        vg.addColorStop(1, 'rgba(0,0,0,0.45)');
        ctx.fillStyle = vg;
        ctx.fillRect(-20, -20, W + 40, H + 40);

        // 心電図モニター
        var ecgTop = 64 + (window.visualViewport ? 0 : 0);
        ctx.fillStyle = 'rgba(2,16,14,0.85)';
        ctx.strokeStyle = 'rgba(80,255,190,0.25)';
        ctx.lineWidth = 1;
        roundRect(12, ecgTop, W - 24, 56, 10); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        var midY = ecgTop + 30;
        for (var x = 16; x <= W - 16; x += 2) {
          var y = midY + ecgY(x, now / 1000);
          if (x === 16) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = state === STATE.DEAD ? '#ff5468' : '#3dff9e';
        ctx.lineWidth = 2;
        ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = state === STATE.DEAD ? '#ff5468' : '#3dff9e';
        ctx.font = '700 11px sans-serif';
        ctx.fillText(state === STATE.DEAD ? 'HR --- FLAT' : 'HR ' + STAGES[stage].bpm, 20, ecgTop + 15);

        // 心臓（鼓動で拡大縮小）
        var cx = W / 2, cy = H * 0.475;
        var s = Math.min(W * 0.36, H * 0.24);
        var beat = 0;
        if (state !== STATE.DEAD) {
          var beatMs = 60000 / STAGES[stage].bpm;
          var bt = (now % beatMs) / beatMs;
          beat = Math.exp(-Math.pow((bt - 0.10) * 6, 2)) * 0.045 + Math.exp(-Math.pow((bt - 0.30) * 7, 2)) * 0.03;
        }
        ctx.save();
        ctx.translate(cx, cy); ctx.scale(1 + beat, 1 + beat); ctx.translate(-cx, -cy);
        var hg = ctx.createRadialGradient(cx - s * 0.3, cy - s * 0.3, s * 0.1, cx, cy, s * 1.25);
        hg.addColorStop(0, '#ff7d8a');
        hg.addColorStop(0.45, '#e8354a');
        hg.addColorStop(1, '#8f1224');
        heartPath(cx, cy, s);
        ctx.fillStyle = hg; ctx.fill();
        ctx.strokeStyle = 'rgba(70,4,14,0.6)'; ctx.lineWidth = 3; ctx.stroke();
        // 大動脈っぽい管
        ctx.strokeStyle = '#c22638'; ctx.lineWidth = s * 0.16; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx - s * 0.28, cy - s * 0.72); ctx.quadraticCurveTo(cx - s * 0.30, cy - s * 1.02, cx - s * 0.05, cy - s * 1.04); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx + s * 0.30, cy - s * 0.70); ctx.quadraticCurveTo(cx + s * 0.42, cy - s * 0.95, cx + s * 0.30, cy - s * 1.06); ctx.stroke();
        ctx.lineCap = 'butt';
        ctx.restore();

        if (state !== STATE.TITLE) {
          var tol = tolRadius();
          // 安全圏（薄い帯）
          ctx.beginPath();
          pathPts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
          ctx.strokeStyle = 'rgba(255,255,255,0.10)';
          ctx.lineWidth = tol * 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
          ctx.stroke();
          // ガイド線（点線）
          ctx.setLineDash([9, 8]);
          ctx.strokeStyle = 'rgba(255,255,255,0.9)';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.setLineDash([]);

          // 縫い終わった部分（ミシンのステッチ）
          if (progress > 1) {
            ctx.beginPath();
            for (var i = 0; i <= progress && i < pathPts.length; i++) {
              if (i === 0) ctx.moveTo(pathPts[i].x, pathPts[i].y); else ctx.lineTo(pathPts[i].x, pathPts[i].y);
            }
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.setLineDash([11, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
            // 針先の光
            var tip = pathPts[Math.min(progress, pathPts.length - 1)];
            ctx.beginPath(); ctx.arc(tip.x, tip.y, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#fff3c4'; ctx.fill();
            ctx.beginPath(); ctx.arc(tip.x, tip.y, 13, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,209,102,0.6)'; ctx.lineWidth = 2; ctx.stroke();
          }

          // スタート / ゴール
          var sp = pathPts[0], gp = pathPts[pathPts.length - 1];
          ctx.beginPath(); ctx.arc(sp.x, sp.y, 15, 0, Math.PI * 2);
          ctx.fillStyle = started ? 'rgba(61,255,158,0.35)' : '#1fae62'; ctx.fill();
          ctx.strokeStyle = '#baffdc'; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = '#eafff3'; ctx.font = '800 10px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('START', sp.x, sp.y + 3.5);
          ctx.beginPath(); ctx.arc(gp.x, gp.y, 15, 0, Math.PI * 2);
          ctx.fillStyle = '#d92b3f'; ctx.fill();
          ctx.strokeStyle = '#ffc2ca'; ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.fillText('GOAL', gp.x, gp.y + 3.5);
          ctx.textAlign = 'left';

          // 指の位置
          if (touching && finger) {
            ctx.beginPath(); ctx.arc(finger.x, finger.y, 16, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(finger.x, finger.y, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff'; ctx.fill();
          }
        }

        // 死亡時の赤フラッシュ
        if (state === STATE.DEAD) {
          var a = Math.max(0, 0.55 - (now - deathAt) / 900);
          if (a > 0) { ctx.fillStyle = 'rgba(200,10,30,' + a + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
        }
        ctx.restore();
        requestAnimationFrame(draw);
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // ============ 判定 ============
      function distToPath(x, y) {
        // 現在の進行付近だけを探索（大きく戻る／飛ぶのも不正として扱う）
        var from = Math.max(0, progress - 8);
        var to = Math.min(pathPts.length - 1, progress + 52);
        var best = Infinity, bestIdx = progress;
        for (var i = from; i <= to; i++) {
          var dx = pathPts[i].x - x, dy = pathPts[i].y - y;
          var d = dx * dx + dy * dy;
          if (d < best) { best = d; bestIdx = i; }
        }
        return { d: Math.sqrt(best), idx: bestIdx };
      }

      function updateProgressLabel() {
        var pct = totalLen > 0 ? Math.floor(pathLen[progress] / totalLen * 100) : 0;
        progressLabel.textContent = '切開 ' + pct + '%';
      }

      function die() {
        state = STATE.DEAD;
        deathAt = performance.now();
        shake = 16;
        touching = false;
        playFlatline();
        setTimeout(showResult, 1100);
      }

      function win() {
        touching = false;
        progressLabel.textContent = '切開 100%';
        totalTime += (performance.now() - startTime) / 1000;
        state = (stage >= STAGES.length - 1) ? STATE.WIN : STATE.STAGECLEAR;
        playSuccess();
        setTimeout(showResult, 700);
      }

      function showResult() {
        var sec = ((performance.now() - startTime) / 1000).toFixed(1);
        var emoji = document.getElementById('result-emoji');
        var title = document.getElementById('result-title');
        var msg = document.getElementById('result-msg');
        var retryBtn = document.getElementById('retry-btn');
        var restartBtn = document.getElementById('restart-btn');
        restartBtn.style.display = 'none';
        var resultScreen = document.getElementById('result-screen');
        if (state === STATE.WIN) {
          resultScreen.classList.add('win-mode');
          emoji.textContent = '🌅';
          title.textContent = '全オペ成功！';
          title.className = 'result-title win';
          msg.innerHTML = '全' + STAGES.length + 'ステージ制覇！最終ステージ「虎澤先輩」まで縫い切りました。<br>見事な縫合でした、柴咲先生。患者は無事です。（合計タイム ' + totalTime.toFixed(1) + '秒）<br>夜通しのオペが終わって、屋上に朝日が昇ってきました。';
          retryBtn.textContent = 'もう1回遊ぶ！';
        } else if (state === STATE.STAGECLEAR) {
          resultScreen.classList.remove('win-mode');
          emoji.textContent = '✨';
          title.textContent = 'STAGE ' + (stage + 1) + ' クリア！';
          title.className = 'result-title clear';
          var next = STAGES[stage + 1];
          var nextIsFinal = (stage + 1) === STAGES.length - 1;
          msg.innerHTML = STAGES[stage].name + '、無事に縫合完了。（タイム ' + sec + '秒）<br>次の患者が来ました……<b style="color:#ffd166">' + (nextIsFinal ? '最終ステージ' : 'STAGE ' + (stage + 2)) + '：' + next.name + '</b><br>線はもっと細く、もっとクネクネします。';
          retryBtn.textContent = nextIsFinal ? '最終ステージへ（' + next.name + '）' : '次のオペへ（STAGE ' + (stage + 2) + '）';
          restartBtn.style.display = '';
        } else {
          resultScreen.classList.remove('win-mode');
          emoji.textContent = '💀';
          title.textContent = '患者は死亡しました';
          title.className = 'result-title lose';
          var isFinalStage = stage === STAGES.length - 1;
          msg.innerHTML = '線からはみ出しました……。<br>' + (isFinalStage ? '最終ステージ' : 'STAGE ' + (stage + 1)) + '「' + STAGES[stage].name + '」切開 ' + Math.floor(pathLen[progress] / totalLen * 100) + '% 地点で心停止。';
          retryBtn.textContent = (isFinalStage ? '最終ステージ' : 'STAGE ' + (stage + 1)) + ' から再挑戦';
          if (stage > 0) restartBtn.style.display = '';
        }
        document.getElementById('result-screen').classList.remove('hidden');
      }

      function resetGame(newStage) {
        stage = newStage;
        buildPath();
        progress = 0; touching = false; started = false; finger = null; shake = 0;
        state = STATE.PLAY;
        startTime = performance.now();
        updateStageHud();
        updateProgressLabel();
        hint.textContent = '緑の丸から、指を離さず線をなぞって';
        hint.style.visibility = 'visible';
        hud.style.visibility = 'visible';
      }

      // ============ 入力 ============
      function pos(e) {
        var t = e.touches ? e.touches[0] : e;
        return { x: t.clientX, y: t.clientY };
      }

      function onDown(e) {
        if (state !== STATE.PLAY) return;
        e.preventDefault();
        var p = pos(e);
        finger = p; touching = true;
        if (!started) {
          var sp = pathPts[0];
          var d = Math.sqrt((p.x - sp.x) * (p.x - sp.x) + (p.y - sp.y) * (p.y - sp.y));
          if (d <= tolRadius() + 6) {
            started = true;
            progress = 0;
            hint.textContent = 'そのまま線の上を、ゴールまで……！';
          } else {
            hint.textContent = 'まず緑の START を押さえて';
          }
          return;
        }
        // 再タッチ時：現在位置から大きく離れていたら即アウト
        var r = distToPath(p.x, p.y);
        if (r.d > tolRadius()) die();
      }

      function onMove(e) {
        if (state !== STATE.PLAY || !touching) return;
        e.preventDefault();
        var p = pos(e);
        finger = p;
        if (!started) return;
        var r = distToPath(p.x, p.y);
        if (r.d > tolRadius()) { die(); return; }
        if (r.idx > progress) {
          progress = r.idx;
          updateProgressLabel();
          if (progress >= pathPts.length - 4) win();
        }
      }

      function onUp(e) {
        if (state !== STATE.PLAY) return;
        touching = false; finger = null;
        if (started && progress < pathPts.length - 4) {
          hint.textContent = '指を離すな……！そのまま続きを押さえて';
        }
      }

      canvas.addEventListener('touchstart', onDown, { passive: false });
      canvas.addEventListener('touchmove', onMove, { passive: false });
      canvas.addEventListener('touchend', onUp);
      canvas.addEventListener('touchcancel', onUp);
      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);

      document.getElementById('start-btn').addEventListener('click', function () {
        document.getElementById('title-screen').classList.add('hidden');
        initAudio();
        totalTime = 0;
        resetGame(0);
      });
      document.getElementById('retry-btn').addEventListener('click', function () {
        initAudio();
        if (state === STATE.WIN) {
          // 全クリア後：屋上から落ちるようにフェードアウトしてから最初へ
          var rs = document.getElementById('result-screen');
          playFall();
          rs.classList.add('falling');
          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          setTimeout(function () {
            rs.classList.remove('falling');
            rs.classList.remove('win-mode');
            rs.classList.add('hidden');
            totalTime = 0;
            resetGame(0);
          }, reduced ? 340 : 1180);
          return;
        }
        document.getElementById('result-screen').classList.add('hidden');
        if (state === STATE.STAGECLEAR) {
          resetGame(stage + 1);            // 次のステージへ
        } else {
          resetGame(stage);                // 死亡：同じステージから再挑戦
        }
      });
      document.getElementById('restart-btn').addEventListener('click', function () {
        document.getElementById('result-screen').classList.add('hidden');
        initAudio();
        totalTime = 0;
        resetGame(0);
      });

      // ============ BGM：ベートーヴェン「エリーゼのために」 ============
      // 音源ファイルなし：Web Audio でピアノ風に合成してループ再生
      var audioCtx = null, bgmOn = true, bgmTimer = null, nextNoteTime = 0, noteIdx = 0;

      // [midi, 長さ(8分音符単位)] エリーゼのために 冒頭フレーズ
      var MEL = [
        [76,1],[75,1],[76,1],[75,1],[76,1],[71,1],[74,1],[72,1],
        [69,2],[0,1],[60,1],[64,1],[69,1],
        [71,2],[0,1],[64,1],[68,1],[71,1],
        [72,2],[0,1],[64,1],[76,1],[75,1],
        [76,1],[75,1],[76,1],[71,1],[74,1],[72,1],
        [69,2],[0,1],[60,1],[64,1],[69,1],
        [71,2],[0,1],[64,1],[72,1],[71,1],
        [69,3],[0,1]
      ];
      // 低音（3拍ごとの土台）
      var BASS = [45, 40, 45, 40, 45, 40, 45, 40, 45, 40, 45, 40, 45, 40];
      var EIGHTH = 60 / 132 / 1; // 8分音符 ≒ 0.4545秒 → テンポ感のある速度
      var bassIdx = 0, beatCount = 0;

      function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

      function pianoNote(midi, time, dur, vol) {
        var f = midiHz(midi);
        var g = audioCtx.createGain();
        var flt = audioCtx.createBiquadFilter();
        flt.type = 'lowpass'; flt.frequency.value = 2600; flt.Q.value = 0.4;
        var o1 = audioCtx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
        var o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
        var g2 = audioCtx.createGain(); g2.gain.value = 0.25;
        o1.connect(flt); o2.connect(g2); g2.connect(flt);
        flt.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(vol, time + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0008, time + Math.max(dur, 0.9));
        o1.start(time); o2.start(time);
        o1.stop(time + Math.max(dur, 0.9) + 0.1); o2.stop(time + Math.max(dur, 0.9) + 0.1);
      }

      function scheduleBgm() {
        if (!audioCtx) return;
        while (nextNoteTime < audioCtx.currentTime + 0.35) {
          var item = MEL[noteIdx % MEL.length];
          if (item[0] > 0) pianoNote(item[0], nextNoteTime, item[1] * EIGHTH, 0.16);
          if (beatCount % 3 === 0) {
            var b = BASS[bassIdx % BASS.length];
            pianoNote(b, nextNoteTime, EIGHTH * 3, 0.10);
            bassIdx++;
          }
          nextNoteTime += item[1] * EIGHTH;
          beatCount += item[1];
          noteIdx++;
        }
      }

      function initAudio() {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
          nextNoteTime = audioCtx.currentTime + 0.1;
          bgmTimer = setInterval(function () { if (bgmOn) scheduleBgm(); }, 120);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      document.getElementById('bgm-btn').addEventListener('click', function () {
        bgmOn = !bgmOn;
        this.textContent = bgmOn ? '♪ BGM：ON' : '♪ BGM：OFF';
        if (bgmOn) { initAudio(); if (audioCtx) nextNoteTime = Math.max(nextNoteTime, audioCtx.currentTime + 0.05); }
      });

      // 死亡時：心電図のフラットライン音
      function playFlatline() {
        if (!audioCtx) return;
        var t = audioCtx.currentTime;
        var o = audioCtx.createOscillator(); o.type = 'sine'; o.frequency.value = 880;
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
        g.gain.setValueAtTime(0.12, t + 0.9);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 1.15);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 1.2);
      }

      // 全クリア後の落下：下降する口笛のような音
      function playFall() {
        if (!audioCtx) return;
        var t = audioCtx.currentTime;
        var o = audioCtx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(880, t);
        o.frequency.exponentialRampToValueAtTime(140, t + 1.0);
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.07, t + 0.15);
        g.gain.exponentialRampToValueAtTime(0.0008, t + 1.05);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 1.1);
      }

      // 成功時：短い上昇アルペジオ
      function playSuccess() {
        if (!audioCtx) return;
        var t = audioCtx.currentTime;
        [72, 76, 79, 84].forEach(function (m, i) { pianoNote(m, t + i * 0.11, 0.5, 0.15); });
      }

      // ============ 起動 ============
      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
